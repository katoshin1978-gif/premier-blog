name: Premier Blog Auto Post

on:
  # 本番の起動は Xサーバーの cron（毎朝 7:00 JST）から workflow_dispatch で行う（deploy/xserver/trigger_autopost.sh）
  # GitHub の schedule は数時間遅れるため、cron が動かなかった日のバックアップとしてのみ残す
  schedule:
    - cron: '0 1 * * *'   # 毎日 01:00 UTC = 10:00 JST（実際は遅延してもっと後になる）
  workflow_dispatch:       # Xサーバー cron / 手動実行ボタン

# 同時実行を防ぐ（遅延した schedule と手動実行が重なると processed.db の重複チェックが効かず同じ記事が2本できる）
# 実行中なら後続は待機させる（キャンセルしない）
concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  # バックアップの schedule 実行時、その日（JST）に workflow_dispatch 実行が既にあればスキップ
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 本日分の実行済みチェック
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # JST 当日 0:00 を UTC に変換
          since=$(date -u -d "$(TZ=Asia/Tokyo date +%Y-%m-%d) 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow auto-post.yml --event workflow_dispatch                 --created ">=$since" --json conclusion --jq '[.[] | select(.conclusion != "cancelled")] | length')
          echo "本日($since 以降)の workflow_dispatch 実行: $n 件"
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  post:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      WP_URL: ${{ secrets.WP_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
      AMAZON_ASSOCIATE_ID: ${{ secrets.AMAZON_ASSOCIATE_ID }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_WS_APP_ID: ${{ secrets.RAKUTEN_WS_APP_ID }}
      RAKUTEN_WS_ACCESS_KEY: ${{ secrets.RAKUTEN_WS_ACCESS_KEY }}
      RAKUTEN_WS_AFFILIATE_ID: ${{ secrets.RAKUTEN_WS_AFFILIATE_ID }}
      AGODA_AFFILIATE_ID: ${{ secrets.AGODA_AFFILIATE_ID }}
      WOWOW_AFFILIATE_ID: ${{ secrets.WOWOW_AFFILIATE_ID }}
      SPTV_AFFILIATE_ID: ${{ secrets.SPTV_AFFILIATE_ID }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      SSL_VERIFY: "false"
      RESOLVE_TO_IP: "false"

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          # 待機後に開始した実行でも、先行実行が push した最新の processed.db を取得する
          ref: master

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: フォントインストール
        run: sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: 依存パッケージインストール
        run: pip install -r requirements.txt

      - name: Playwright Chromium インストール
        run: python -m playwright install --with-deps chromium

      - name: main.py 実行
        run: python main.py

      # main.py が失敗（残高不足・0件）しても重複防止DBは保存する
      - name: processed.db をコミット
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add processed.db
          git diff --staged --quiet || git commit -m "chore: update processed.db [skip ci]"
          git push
